name: Build Mac App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pdfplumber openpyxl pypdf reportlab

    - name: Build with PyInstaller
      run: |
        # รันคำสั่งสร้างไฟล์สำหรับ Mac (สังเกตว่าใช้ : แทน ; ใน add-data)
        pyinstaller --onefile --windowed --add-data "fonts:fonts" shopee_report.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shopee_report_mac
        path: dist/
